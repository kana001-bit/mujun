# PR と main への push で `pnpm check`（typecheck → ESLint・Prettier → test → selftest → 拡張のビルドとテスト）と build を回す。
# ローカルの「作業の最後に pnpm check」と同じもの（AGENTS.md）。Windows でも使うので両方で走らせる。
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # バージョンは package.json の packageManager から
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # engines.node の下限で確かめる
          # ランナーにキャッシュされた古い 24.x を使わず、毎回 24 系の最新（修正版）を取る。
          # キャッシュの 24.20.0 のまま、CVE-2026-111497（Brotli）の修正版 24.22.1 を使っていなかったため
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
